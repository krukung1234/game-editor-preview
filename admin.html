<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin | Krukung Game Hub</title>

  <link
    rel="stylesheet"
    href="css/admin.css"
  >
</head>

<body>

  <!-- =====================================
       หน้าล็อกอิน Admin
  ====================================== -->

  <div
    id="adminLogin"
    class="login-screen"
  >
    <div class="login-card">

      <div class="login-logo">
        🔐
      </div>

      <h1>Admin</h1>

      <p>
        ระบบจัดการเกม ครูกุ้งสอนไอที
      </p>

      <input
        id="adminPassword"
        type="password"
        placeholder="รหัส Admin"
        autocomplete="current-password"
      >

      <button
        id="adminLoginBtn"
        type="button"
      >
        เข้าสู่ระบบ
      </button>

      <small id="adminError"></small>

    </div>
  </div>


  <!-- =====================================
       หน้าจัดการเกม
  ====================================== -->

  <div
    id="adminPanel"
    class="hidden"
  >

    <!-- ส่วนหัว -->

    <header class="admin-top">

      <div>
        <h1>
          🎮 จัดการเกม
        </h1>

        <p>
          เพิ่มเกมด้วยชื่อโฟลเดอร์ เช่น
          <b>ar-sudoku</b>
          ระบบจะสร้างลิงก์ให้อัตโนมัติ
        </p>
      </div>

      <div class="top-actions">

        <a
          href="index.html"
          target="_blank"
          rel="noopener"
        >
          ดูหน้าเว็บ
        </a>

        <button
          id="logoutAdmin"
          type="button"
        >
          ออกจากระบบ
        </button>

      </div>

    </header>


    <!-- เนื้อหา -->

    <main class="admin-container">

      <!-- สถิติ -->

      <section class="stats">

        <div>
          <b id="totalGames">0</b>
          <span>เกมทั้งหมด</span>
        </div>

        <div>
          <b id="openGames">0</b>
          <span>เปิดเล่น</span>
        </div>

        <div>
          <b id="soonGames">0</b>
          <span>เร็ว ๆ นี้</span>
        </div>

      </section>


      <!-- ฟอร์มเพิ่มและแก้ไขเกม -->

      <section class="card form-card">

        <h2>
          ➕ เพิ่ม / แก้ไขเกม
        </h2>

        <form id="gameForm">

          <!-- รหัสเกม ใช้ตอนแก้ไข -->

          <input
            type="hidden"
            id="id"
          >


          <!-- ชื่อเกมและหมวดหมู่ -->

          <div class="grid2">

            <label>
              ชื่อเกม

              <input
                id="title"
                type="text"
                required
                placeholder="เช่น AR Sudoku"
              >
            </label>

            <label>
              หมวดหมู่

              <select id="category"></select>
            </label>

          </div>


          <!-- รายละเอียดเกม -->

          <label>
            รายละเอียดสั้น ๆ

            <textarea
              id="description"
              maxlength="90"
              rows="3"
              placeholder="ไม่เกิน 90 ตัวอักษร เพื่อให้การ์ดสวยเท่ากัน"
            ></textarea>

            <small>
              <span id="descCount">0</span>/90 ตัวอักษร
            </small>
          </label>


          <!-- รูปปกและชื่อโฟลเดอร์ -->

          <div class="grid2">

            <label>
              รูปปก / ลิงก์รูป

              <input
                id="image"
                type="text"
                placeholder="เว้นว่างได้ ระบบจะใช้ games/ชื่อโฟลเดอร์/cover.png"
              >
            </label>

            <label>
              ชื่อโฟลเดอร์เกม

              <input
                id="folder"
                type="text"
                required
                placeholder="เช่น ar-sudoku"
              >
            </label>

          </div>


          <!-- สถานะและลิงก์เกม -->

          <div class="grid2">

            <label>
              สถานะ

              <select id="status">

                <option value="open">
                  เปิดเล่น
                </option>

                <option value="soon">
                  เร็ว ๆ นี้
                </option>

                <option value="hidden">
                  ซ่อน
                </option>

              </select>
            </label>

            <label>
              ลิงก์ที่ระบบสร้าง

              <input
                id="linkPreview"
                type="text"
                readonly
                placeholder="games/.../index.html"
              >
            </label>

          </div>


          <!-- =====================================
               ช่อง Prompt ที่เพิ่มใหม่
          ====================================== -->

          <label class="prompt-field">

            <span class="prompt-label">
              📋 Prompt สำหรับสร้างหรือแก้ไขเกม
            </span>

            <textarea
              id="prompt"
              rows="16"
              placeholder="วาง Prompt ของเกมนี้ที่นี่ เพื่อให้สมาชิกสามารถคัดลอกไปสร้างหรือแก้ไขเป็นเกมของตนเองได้"
            ></textarea>

            <small class="prompt-help">
              สมาชิกจะเห็นปุ่ม “Prompt”
              บนการ์ดเกมเมื่อเกมนี้มีข้อความ Prompt
            </small>

          </label>


          <!-- ปุ่มควบคุม -->

          <div class="form-actions">

            <button
              type="submit"
            >
              💾 บันทึกเกม
            </button>

            <button
              type="button"
              id="resetBtn"
            >
              ล้างฟอร์ม
            </button>

          </div>

        </form>

      </section>


      <!-- รายการเกม -->

      <section class="card">

        <div class="list-head">

          <h2>
            รายการเกม
          </h2>

          <input
            id="adminSearch"
            type="search"
            placeholder="ค้นหาเกม..."
          >

        </div>

        <div
          id="gameList"
          class="game-list"
        ></div>

      </section>

    </main>

  </div>


  <!-- =====================================
       JavaScript
  ====================================== -->

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>

</body>
</html>
