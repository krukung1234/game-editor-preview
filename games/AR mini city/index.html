<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AR MINI CITY — มินิเกมสินค้าและบริการ</title>
<style>
:root{--blue:#1489e8;--navy:#083b66;--green:#43c653;--pink:#ff5d8f;--yellow:#ffd447;--orange:#ff9638;--card:rgba(255,255,255,.94);--shadow:0 10px 30px rgba(0,0,0,.22)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:"Tahoma","Noto Sans Thai",system-ui,sans-serif;background:#0b77c5;color:#123;overflow:hidden}
button{font:inherit;cursor:pointer}.app{width:100%;height:100%;display:grid;place-items:center;background:linear-gradient(#7fd5ff,#d8f5ff)}
.game{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;max-height:100vh;overflow:hidden;background:#dff6ff;box-shadow:0 0 40px rgba(0,0,0,.3)}
.screen{position:absolute;inset:0;display:none}.screen.active{display:block}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.12));z-index:1;pointer-events:none}
.topbar{position:absolute;z-index:20;left:1.2%;right:1.2%;top:1.5%;display:flex;align-items:center;gap:10px;justify-content:space-between}.pill{background:rgba(255,255,255,.94);border:3px solid #fff;border-radius:999px;box-shadow:var(--shadow);padding:.55em 1em;font-weight:900;color:var(--navy);font-size:clamp(12px,1.1vw,22px)}.top-actions{display:flex;gap:8px}.icon-btn{width:clamp(42px,3.6vw,62px);height:clamp(42px,3.6vw,62px);border:none;border-radius:50%;background:#fff;box-shadow:var(--shadow);font-size:clamp(20px,2vw,30px)}
.cover-ui{position:absolute;z-index:10;left:50%;bottom:5%;transform:translateX(-50%);display:flex;gap:12px;align-items:center}.start-btn{border:5px solid #fff;border-radius:999px;background:linear-gradient(#69e65b,#21b935);color:#fff;font-weight:900;font-size:clamp(24px,3vw,50px);padding:.4em 1.5em;box-shadow:0 8px 0 #13882a,0 12px 25px rgba(0,0,0,.35);text-shadow:0 3px 0 rgba(0,0,0,.2)}.start-btn:active{transform:translateY(5px);box-shadow:0 3px 0 #13882a}
.map-title{position:absolute;z-index:10;top:2%;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.95);border:4px solid #fff;border-radius:22px;padding:.45em 1.1em;box-shadow:var(--shadow);font-size:clamp(18px,2vw,34px);font-weight:900;color:#0b548e}.zone-grid{position:absolute;z-index:10;left:4%;right:4%;bottom:4%;display:grid;grid-template-columns:repeat(5,1fr);gap:1.1%}.zone-btn{position:relative;min-height:100px;border:4px solid #fff;border-radius:22px;color:#fff;font-weight:900;font-size:clamp(14px,1.35vw,24px);padding:.6em .4em;box-shadow:var(--shadow);text-shadow:0 2px 2px rgba(0,0,0,.25);transition:.2s}.zone-btn:hover{transform:translateY(-4px)}.zone-btn[data-zone="shopping"]{background:#ef5a8d}.zone-btn[data-zone="health"]{background:#20b7a8}.zone-btn[data-zone="education"]{background:#ff8f32}.zone-btn[data-zone="food"]{background:#4dbb48}.zone-btn[data-zone="service"]{background:#8d5ce6}.zone-btn.locked{filter:grayscale(.8) brightness(.78);cursor:not-allowed}.zone-btn .lock{display:block;font-size:1.4em}.zone-btn .stars{display:block;margin-top:.25em;font-size:.85em;color:#fff7a6}
.panel{position:absolute;z-index:8;left:4%;right:4%;top:12%;bottom:5%;display:grid;grid-template-columns:1.35fr .85fr;gap:2%}.play-card,.side-card{background:var(--card);border:4px solid rgba(255,255,255,.95);border-radius:28px;box-shadow:var(--shadow);min-width:0;overflow:hidden}.play-card{padding:2.3%;display:flex;flex-direction:column;align-items:center;justify-content:center}.side-card{padding:2.2%;display:flex;flex-direction:column;justify-content:center;gap:1.4%}.qtag{font-size:clamp(13px,1.1vw,20px);font-weight:900;color:#fff;background:#168ce0;border-radius:999px;padding:.35em .9em}.question{margin:.5em 0 .3em;font-size:clamp(22px,2.3vw,42px);font-weight:900;text-align:center;color:#083b66;line-height:1.18}.subq{font-size:clamp(13px,1.05vw,19px);color:#456;text-align:center;margin-bottom:.7em}.main-asset{max-width:55%;max-height:43%;object-fit:contain;filter:drop-shadow(0 8px 8px rgba(0,0,0,.14))}.choices{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:1.5%}.choice{position:relative;min-height:clamp(64px,7vw,105px);border:4px solid #d9ebf6;border-radius:20px;background:#fff;color:#124f7a;font-size:clamp(17px,1.55vw,28px);font-weight:900;padding:.55em .7em;box-shadow:0 5px 14px rgba(0,0,0,.1);overflow:hidden}.choice.with-img{display:flex;align-items:center;justify-content:center;gap:10px}.choice.with-img img{width:clamp(54px,6vw,92px);height:clamp(54px,6vw,92px);object-fit:contain}.choice.correct{background:#e7ffe8;border-color:#39c94b;color:#146a20}.choice.wrong{background:#ffe8e8;border-color:#ff5757;color:#9f1e1e}.choice.disabled{pointer-events:none}.choice .dwell{position:absolute;left:0;bottom:0;height:7px;width:0;background:#19bf49;transition:width .08s linear}.stat{background:#f3f9fd;border-radius:18px;padding:.8em 1em;font-weight:800;font-size:clamp(13px,1.08vw,20px)}.bigstat{font-size:clamp(22px,2vw,36px);font-weight:900;color:#0d5f9a}.progress{height:16px;background:#d9edf7;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#43c653,#ffd447);transition:.35s}.feedback{min-height:3.2em;display:grid;place-items:center;text-align:center;font-weight:900;font-size:clamp(14px,1.18vw,21px);color:#134}.feedback.toast{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);z-index:30;min-width:min(520px,72%);padding:.8em 1.2em;border-radius:999px;background:rgba(255,255,255,.96);border:3px solid #d8ecf7;box-shadow:0 10px 28px rgba(0,0,0,.18);pointer-events:none}.play-card.auto-advance{position:relative}.play-card.auto-advance .question{max-width:92%;margin-bottom:.45em}.play-card.auto-advance .main-asset{max-width:48%;max-height:46%;margin:.2em 0 .5em}.play-card.auto-advance .choices{gap:18px;max-width:92%;margin-top:.8%}.play-card.auto-advance .choice{min-height:clamp(78px,8vw,116px);font-size:clamp(19px,1.7vw,30px);border-width:4px;transition:transform .15s ease,box-shadow .15s ease,background .2s ease}.play-card.auto-advance .choice:not(.disabled):active{transform:scale(.98)}.play-card.auto-advance .choice.correct{box-shadow:0 0 0 5px rgba(57,201,75,.12),0 8px 18px rgba(0,0,0,.1)}.play-card.auto-advance .choice.wrong{box-shadow:0 0 0 5px rgba(255,87,87,.10),0 8px 18px rgba(0,0,0,.1)}.mini-btn{border:none;border-radius:16px;padding:.7em 1em;font-weight:900;background:#1389e5;color:#fff;box-shadow:0 4px 0 #0b619f}.mini-btn.alt{background:#7c5bd6;box-shadow:0 4px 0 #5c3dac}.mini-btn.red{background:#ff655c;box-shadow:0 4px 0 #ba3932}.hidden{display:none!important}
.shopping-list{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:.4em 0}.chip{border:3px solid #d9ebf6;border-radius:999px;background:#fff;padding:.3em .7em;font-weight:900;font-size:clamp(12px,1vw,18px)}.chip.done{background:#dcffe0;border-color:#40c552;text-decoration:line-through}.product-grid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:1%}.product-btn{height:clamp(100px,10vw,155px);border:4px solid #d7ecf7;background:#fff;border-radius:20px;position:relative;padding:4px}.product-btn img{width:100%;height:78%;object-fit:contain}.product-btn span{display:block;font-size:clamp(11px,.95vw,17px);font-weight:900;color:#164f79}.product-btn.selected{border-color:#3bc953;background:#ebffed}.basket{font-size:clamp(26px,2.8vw,48px);text-align:center}
.modal{position:absolute;z-index:80;inset:0;background:rgba(5,35,58,.62);display:none;place-items:center;padding:4%}.modal.show{display:grid}.modal-box{width:min(720px,90%);background:#fff;border-radius:28px;border:5px solid #fff;box-shadow:var(--shadow);padding:4%;text-align:center}.modal-box h2{font-size:clamp(24px,3vw,46px);margin:.2em;color:#0b5d96}.modal-box p{font-size:clamp(15px,1.35vw,22px);line-height:1.55}.summary-stars{font-size:clamp(38px,5vw,76px)}
.camera-layer{position:absolute;z-index:3;inset:0;pointer-events:none;display:none}.camera-layer.on{display:block}.camera-layer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.22}.hand-cursor{position:absolute;width:38px;height:38px;border:5px solid #26dfff;border-radius:50%;box-shadow:0 0 18px #0bf, inset 0 0 10px #0bf;transform:translate(-50%,-50%);display:none}.hand-cursor:after{content:"☝️";position:absolute;font-size:26px;left:50%;top:50%;transform:translate(-50%,-55%)}
@media(max-aspect-ratio:4/3){.game{width:100vw;height:auto;max-height:100vh}.panel{grid-template-columns:1fr .62fr;left:2%;right:2%}.zone-grid{left:2%;right:2%;gap:.5%}.zone-btn{border-width:2px;border-radius:14px;min-height:82px}.play-card,.side-card{border-radius:18px}.choices{gap:7px}.choice{border-width:2px}.topbar{top:.8%}}

/* V3 PLAY SCREEN — large child-friendly layout */
.panel{left:3%;right:3%;top:11.5%;bottom:3.2%;grid-template-columns:1fr 19%;gap:1.2%}
.play-card{padding:1.3% 1.7%;border:5px solid #47a9ef;background:rgba(255,255,255,.95);justify-content:flex-start}
.side-card{padding:1.4%;border:5px solid #47a9ef;background:rgba(255,255,255,.95);justify-content:flex-start;gap:1.4%}
.qtag{background:linear-gradient(#ff9a2f,#e86e17);font-size:clamp(14px,1.15vw,21px);margin-top:.1%}
.question{font-size:clamp(25px,2.35vw,43px);margin:.25em 0 .15em;line-height:1.12}
.play-card.auto-advance .question{max-width:98%}
.play-card.auto-advance .main-asset{max-width:56%;max-height:52%;margin:0 auto .15em}
.play-card.auto-advance .choices{max-width:94%;gap:22px;margin-top:auto;margin-bottom:.4%}
.play-card.auto-advance .choice{min-height:clamp(76px,7.2vw,112px);border-radius:999px;border:5px solid #fff;color:#fff;font-size:clamp(23px,2vw,36px);box-shadow:0 7px 0 rgba(0,0,0,.15),0 10px 22px rgba(0,0,0,.15)}
.play-card.auto-advance .choice:nth-child(1){background:linear-gradient(#42bfff,#118ee5)}
.play-card.auto-advance .choice:nth-child(2){background:linear-gradient(#ff7ca9,#ed3f7d)}
.play-card.auto-advance .choice:nth-child(n+3){background:linear-gradient(#8c72f2,#654bd4)}
.play-card.auto-advance .choice.correct{background:linear-gradient(#65dc6e,#2eb541)!important;border-color:#dfffe2;color:#fff}
.play-card.auto-advance .choice.wrong{background:linear-gradient(#ff7777,#e83f3f)!important;border-color:#ffe0e0;color:#fff}
.side-card .stat:first-child{background:linear-gradient(#2e9eed,#187bca);color:#fff;text-align:center;font-size:clamp(16px,1.25vw,23px)}
.bigstat{font-size:clamp(28px,2.6vw,46px);text-align:center;margin:.15em 0;color:#164f9c}
.side-card .progress{height:22px;border:3px solid #8fd5f7;background:#dff4ff}
#sideProgress{text-align:center;font-size:clamp(16px,1.3vw,24px)}
#feedback{margin-top:auto;background:#eef8ff;border-radius:20px;padding:.8em .5em;min-height:5.2em}
.feedback.toast{bottom:4%;min-width:min(600px,68%);font-size:clamp(17px,1.4vw,25px)}
#nextBtn{display:none!important}
@media(max-aspect-ratio:4/3){.panel{grid-template-columns:1fr 22%;left:1.5%;right:1.5%;gap:.7%}.play-card.auto-advance .main-asset{max-width:52%;max-height:48%}.play-card.auto-advance .choices{gap:10px}.side-card{padding:1%}}

/* V4 CENTER FEEDBACK + CONFETTI */
.answer-overlay{position:absolute;inset:0;z-index:55;display:none;align-items:center;justify-content:center;pointer-events:none}
.answer-overlay.show{display:flex}
.answer-badge{position:relative;min-width:min(520px,58%);padding:.55em 1.15em .62em;border-radius:30px;border:6px solid #fff;text-align:center;font-weight:1000;font-size:clamp(28px,3.5vw,62px);line-height:1;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.22);box-shadow:0 16px 35px rgba(0,0,0,.28);animation:answerPop .28s cubic-bezier(.2,.9,.25,1.25)}
.answer-badge.ok{background:linear-gradient(180deg,#67df63 0%,#23ad3e 70%,#159031 100%);box-shadow:0 0 0 7px rgba(82,218,91,.18),0 16px 35px rgba(0,0,0,.28)}
.answer-badge.bad{background:linear-gradient(180deg,#ff7a7a 0%,#eb4747 70%,#cb2f2f 100%);box-shadow:0 0 0 7px rgba(255,90,90,.16),0 16px 35px rgba(0,0,0,.28)}
.answer-badge .mark{display:inline-grid;place-items:center;width:1.2em;height:1.2em;margin-right:.2em;border-radius:50%;background:#fff;color:#1aa83c;text-shadow:none;vertical-align:.05em;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.answer-badge.bad .mark{color:#dd3535}
.answer-sub{display:block;margin-top:.45em;font-size:clamp(14px,1.2vw,22px);font-weight:900;text-shadow:none;color:#fff}
@keyframes answerPop{0%{transform:scale(.72);opacity:0}75%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.confetti-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti-piece{position:absolute;left:50%;top:48%;width:clamp(8px,.8vw,14px);height:clamp(14px,1.25vw,22px);border-radius:3px;opacity:0;animation:confettiBurst 1.05s ease-out forwards}
@keyframes confettiBurst{0%{transform:translate(0,0) rotate(0deg) scale(.5);opacity:1}75%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1);opacity:0}}
#feedback{min-height:3.5em;margin-top:auto;background:#f5fbff;border:2px dashed #cfe9f7;color:#31556d;border-radius:18px;padding:.65em .55em}
#feedback.toast{position:static;transform:none;min-width:0;padding:.65em .55em;border-radius:18px;box-shadow:none;background:#f5fbff;border:2px dashed #cfe9f7;font-size:clamp(14px,1.05vw,19px)}
@media(max-width:700px){.answer-badge{min-width:76%;font-size:clamp(24px,8vw,42px);border-width:4px}.answer-sub{font-size:clamp(13px,4vw,18px)}}

/* V5 — keep every answer visible inside 16:9 */
.play-card.auto-advance .choices:has(.choice:nth-child(3)){grid-template-columns:repeat(3,minmax(0,1fr));max-width:96%;gap:14px}
.play-card.auto-advance .choices:has(.choice:nth-child(3)) .choice{min-height:clamp(68px,6.3vw,96px);font-size:clamp(19px,1.65vw,30px);padding:.42em .35em}
.play-card.auto-advance:has(.choices .choice:nth-child(3)) .main-asset{max-height:44%;max-width:52%;margin:0 auto .05em}
.play-card.auto-advance:has(.choices .choice:nth-child(3)) .question{font-size:clamp(24px,2.15vw,39px);margin:.18em 0 .08em}
@media(max-aspect-ratio:4/3){.play-card.auto-advance .choices:has(.choice:nth-child(3)){gap:7px}.play-card.auto-advance .choices:has(.choice:nth-child(3)) .choice{font-size:clamp(16px,1.45vw,24px);min-height:62px}}


/* V6: compact mascot score sidebar + safe 3-choice layout */
.panel{left:4%;right:4%;top:12%;bottom:5%;grid-template-columns:minmax(0,4.45fr) minmax(220px,1fr);gap:1.2%}
.play-card{padding:1.65% 2.1%;justify-content:flex-start}
.side-card{padding:1.3%;justify-content:flex-start;gap:1.2%;border-color:#8bd3ff;background:rgba(255,255,255,.97)}
.side-card .qtag{width:100%;text-align:center;background:linear-gradient(180deg,#ff6596,#e63d76);font-size:clamp(15px,1.25vw,22px);padding:.5em .6em}
.side-card .bigstat{width:100%;text-align:center;font-size:clamp(28px,2.8vw,48px);padding:.18em 0;color:#164d9c}
.side-card .progress{width:100%;height:14px;border:2px solid #7acbf7}
.side-card .stat{width:100%;text-align:center;padding:.55em .45em;background:#f5fbff;font-size:clamp(14px,1.1vw,19px)}
.feedback{margin-top:auto;width:100%;min-height:7.8em;border:2px dashed #b9e3fb;border-radius:22px;background:linear-gradient(180deg,#fff,#eef9ff);padding:.65em .5em .55em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25em}
.feedback::before{content:'👧🏻';display:block;font-size:clamp(38px,4vw,68px);line-height:1}
.feedback::after{content:'เก่งมาก! ไปต่อกันเลย';display:block;color:#15528b;font-size:clamp(12px,.95vw,17px)}
.play-card.auto-advance .question{margin:.28em 0 .15em;line-height:1.1}
.play-card.auto-advance .main-asset{max-width:44%;max-height:43%;margin:.05em 0 .25em}
.play-card.auto-advance .choices{margin-top:.4%;gap:12px}
.play-card.auto-advance .choice{min-height:clamp(70px,7.2vw,100px)}
.play-card.three-choices .main-asset{max-height:40%;max-width:42%}
.play-card.three-choices .choices{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.play-card.three-choices .choice{min-height:clamp(68px,6.7vw,94px);font-size:clamp(16px,1.42vw,25px);padding:.45em .35em}
@media(max-aspect-ratio:4/3){.panel{left:2%;right:2%;grid-template-columns:minmax(0,3.7fr) minmax(180px,1fr)}}

/* V7 — a distinct mini-game for each city zone */
.sort-hint{display:flex;gap:14px;width:92%;margin-top:auto}.sort-bin{flex:1;border:4px dashed #9ccfea;border-radius:24px;padding:.65em;text-align:center;font-size:clamp(18px,1.55vw,28px);font-weight:900;color:#15528b;background:#f7fcff}.sort-bin:last-child{border-color:#e9a5c0;color:#9f3261;background:#fff7fb}
.pack-status{width:92%;display:flex;align-items:center;justify-content:center;gap:14px;margin:.25em 0 .45em;padding:.45em .8em;border-radius:20px;background:#fff6dc;color:#805b12;font-size:clamp(15px,1.25vw,22px);font-weight:900}.pack-status .bag{font-size:clamp(32px,3vw,52px)}.pack-status .packed{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.pack-status .packed span{background:#fff;border-radius:999px;padding:.22em .55em;border:2px solid #f6c752;font-size:.8em}
.match-board{width:96%;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:.45em 0}.match-task,.service-card{position:relative;border:4px solid #d8eaf6;border-radius:20px;background:#fff;color:#124f7a;font:inherit;font-weight:900;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.1)}.match-task{min-height:clamp(138px,14vw,205px);padding:.4em}.match-task img{width:100%;height:70%;object-fit:contain}.match-task span:not(.dwell){display:block;font-size:clamp(13px,1.08vw,20px);line-height:1.12}.match-task.active{border-color:#f7b844;background:#fff7dd;transform:translateY(-3px)}.match-task.done{border-color:#43c653;background:#ebffed;color:#176825}.match-task.done::after{content:'✓';position:absolute;right:7px;top:5px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#36bb4c;color:#fff;font-size:23px}
.match-help{margin:.15em 0;font-weight:900;color:#5d7180;font-size:clamp(14px,1.1vw,20px)}.service-shelf{width:96%;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}.service-card{min-height:clamp(84px,8.5vw,126px);padding:.28em}.service-card img{width:48%;height:72%;object-fit:contain;vertical-align:middle}.service-card span:not(.dwell){display:inline-block;max-width:48%;vertical-align:middle;font-size:clamp(13px,1.05vw,19px);line-height:1.1}.service-card.used{border-color:#43c653;background:#ebffed;color:#176825}.service-card.wrong{border-color:#f14f4f;background:#ffe9e9;color:#a61d1d}

/* V8 — five clearly different mini-games, using only the existing assets */

isabled':''}><img src="${item[1]}" alt="${name}"><span>${name}</span>${badge?`<span class="answer-state">${badge}</span>`:''}<span class="dwell"></span></button>`}).join('')}</div></div>`;if(!revealed)document.querySelectorAll('.school-item').forEach(button=>button.addEventListener('click',()=>selectOption('education',button.dataset.name,button)));document.querySelector('.education-next')?.addEventListener('click',advanceEducationQuestion)}
function selectEducationOption(value){if(round.busy||round.educationRevealed)return;const task=round.education[round.index],picked=round.educationPicked;if(picked.has(value))return;picked.add(value);if(picked.size<task.targets.length){renderEducation(document.getElementById('playCard'));return}const points=task.targets.filter(name=>picked.has(name)).length;round.educationPoints=points;round.educationRevealed=true;round.busy=true;round.score+=points;beep(points===task.targets.length);renderEducation(document.getElementById('playCard'))}
function finishEducationZone(){const total=round.education.length*3,earned=Math.max(1,Math.round((round.score/total)*3));if(!state.completed.includes(round.zone)){state.completed.push(round.zone);state.stars+=earned;state.unlocked=Math.min(5,Math.max(state.unlocked,zoneIndex(round.zone)+1));saveState()}document.getElementById('progressBar').style.width='100%';const all=state.completed.length===5;showModal(`<div class="summary-stars">${'⭐'.repeat(earned)}</div><h2>${all?'🏆 AR MINI CITY MASTER':'ภารกิจสำเร็จ!'}</h2><p>ด่านนี้ทำสำเร็จ <b>${round.score}/${total}</b> คะแนน<br>รับดาว ${earned} ดวง</p>${all?'<p><b>นักสำรวจสินค้าและบริการ</b><br>รู้จักเลือกใช้สินค้าและบริการในชีวิตประจำวันแล้ว!</p>':''}<button class="start-btn" id="modalMapBtn" style="font-size:24px">กลับเมือง</button>`);setTimeout(()=>document.getElementById('modalMapBtn')?.addEventListener('click',()=>{hideModal();show('map')}),0)}
function advanceEducationQuestion(){round.index++;round.educationPicked=new Set();round.educationRevealed=false;round.educationPoints=0;round.busy=false;if(round.index>=round.education.length)finishEducationZone();else renderQuestion()}
function selectOption(kind,value,element){if(kind==='education')return selectEducationOption(value);if(kind==='food'||kind==='food-confirm')return selectFoodOption(kind,value,element);return selectOptionLegacy(kind,value,element)}
function foodResultState(name,food,picked,sum){const selected=picked.has(name);if(food.mode==='list'){const correct=food.targets.includes(name);if(selected&&correct)return 'selected-correct';if(selected&&!correct)return 'selected-wrong';if(!selected&&correct)return 'missed-correct';return ''}if(!selected)return '';return sum<=food.budget?'selected-correct':'selected-wrong'}
function foodRoundScore(food,picked,sum){if(food.mode==='list')return food.targets.filter(name=>picked.has(name)).length;if(food.mode==='budget')return sum<=food.budget?3:0;const remaining=food.budget-sum;if(remaining<0)return 0;if(remaining>5)return 1;if(remaining>=3)return 2;return 3}
function foodResultText(food,sum,points){if(food.mode==='list')return points===3?'✓ เยี่ยมมาก! ได้ 3/3 คะแนน':`ได้ ${points}/3 คะแนน • ดูเฉลยที่การ์ด`;if(food.mode==='budget')return sum<=food.budget?`✓ ภารกิจสำเร็จ! รวม ${sum} บาท • ได้ 3/3 คะแนน`:`เกินงบ ${sum-food.budget} บาท • ได้ 0/3 คะแนน`;const remaining=food.budget-sum;return `ใช้ไป ${sum} บาท • เหลือ ${remaining} บาท • ได้ ${points}/3 คะแนน`}
function renderFood(card){const food=round.food[round.index],picked=round.foodSelected,revealed=round.foodRevealed===true,order=round.foodOrders[round.index]||(round.foodOrders[round.index]=shuffle(food.items)),sum=[...picked].reduce((total,name)=>total+food.items.find(item=>item.name===name).price,0),remaining=food.mode==='list'?null:food.budget-sum,points=revealed?round.foodPoints:0,isList=food.mode==='list',lastRound=round.index===round.food.length-1;setStatus('ภารกิจ',round.index+1,round.food.length);const normalHint=isList?'เลือกหรือยกเลิกสินค้าได้ แล้วกดยืนยันการซื้อ':'เลือกหรือยกเลิกสินค้าได้ แล้วกดยืนยันการซื้อ';const resultText=revealed?foodResultText(food,sum,points):normalHint;setFeedback(revealed?(lastRound?`ผ่านย่านอาหารแล้ว! 🎉 ได้ ${round.score}/${round.food.length*3} คะแนน`:resultText):normalHint);const basketSummary=isList?`<div class="cart-slots">${food.targets.map(name=>`<span>${name}</span>`).join('')}</div>`:`<div class="money ${remaining<0?'budget-warning':''}">💰 เลือกแล้ว ${picked.size}/${food.pickCount} • รวม ${sum} บาท • ${remaining<0?`เกินงบ ${Math.abs(remaining)} บาท`:`เหลือ ${remaining} บาท`}</div>`;const selectionText=revealed?(lastRound?`ผ่านย่านอาหารแล้ว! 🎉 ได้ ${round.score}/${round.food.length*3} คะแนน`:resultText):(isList?`🛒 เลือกแล้ว <b>${picked.size}/${food.pickCount}</b>`:`🛒 เลือกแล้ว <b>${picked.size}/${food.pickCount}</b> • รวม <b>${sum}</b> บาท • ${remaining<0?`เกินงบ <b>${Math.abs(remaining)}</b> บาท`:`เหลือ <b>${remaining}</b> บาท`}`);card.classList.add('food-stage');card.innerHTML=`<div class="qtag">ภารกิจ ${round.index+1}/3 • ${food.label}</div><div class="question">${food.title}</div><div class="cart-board"><span class="cart-icon">🛒</span><div class="cart-info"><div class="food-instruction">${food.hint}</div>${basketSummary}</div>${!revealed?`<div class="food-cart-actions"><button class="confirm-buy ${picked.size===food.pickCount?'ready selectable':''}" ${picked.size===food.pickCount?'':'disabled'}>ยืนยัน<br>การซื้อ<span class="dwell"></span></button></div>`:''}</div><div class="selection-counter ${revealed?'food-feedback':''}"><span>${selectionText}</span>${revealed?`<button class="food-next selectable">${lastRound?'กลับเมือง →':'ภารกิจต่อไป →'}<span class="dwell"></span></button>`:''}</div><div class="product-grid">${order.map(item=>{const state=revealed?foodResultState(item.name,food,picked,sum):(picked.has(item.name)?'selected':''),badge=state==='selected-correct'?(isList?'✓ ถูก':'✓ ผ่านงบ'):state==='selected-wrong'?(isList?'✕ เลือกผิด':'✕ เกินงบ'):state==='missed-correct'?'✓ ควรเลือก':'';return `<button class="product-btn food-card ${isList?'list-mode':''} ${state} ${revealed?'':'selectable'}" data-name="${item.name}" ${revealed?'disabled':''}><img src="${item.img}" alt="${item.name}"><span>${item.name}</span>${isList?'':`<span class="price">${item.price} บาท</span>`}${badge?`<span class="answer-state">${badge}</span>`:''}<span class="dwell"></span></button>`}).join('')}</div>`;if(!revealed)document.querySelectorAll('.food-card[data-name]').forEach(button=>button.addEventListener('click',()=>selectOption('food',button.dataset.name,button)));document.querySelector('.confirm-buy.ready')?.addEventListener('click',event=>selectOption('food-confirm','confirm',event.currentTarget));document.querySelector('.food-next')?.addEventListener('click',advanceFoodRound)}
function selectFoodOption(kind,value){if(round.busy||round.foodRevealed)return;const food=round.food[round.index],picked=round.foodSelected;if(kind==='food-confirm'){if(picked.size!==food.pickCount)return;const sum=[...picked].reduce((total,name)=>total+food.items.find(item=>item.name===name).price,0);round.foodPoints=foodRoundScore(food,picked,sum);round.foodRevealed=true;round.busy=true;round.score+=round.foodPoints;beep(round.foodPoints===3);renderFood(document.getElementById('playCard'));return}if(picked.has(value))picked.delete(value);else if(picked.size<food.pickCount)picked.add(value);else{setFeedback(`เลือกครบ ${food.pickCount} อย่างแล้ว กดชิ้นที่เลือกเพื่อนำออกได้`);return}renderFood(document.getElementById('playCard'))}
function completeFoodAndReturnMap(){const total=round.food.length*3,earned=Math.max(1,Math.round((round.score/total)*3));if(!state.completed.includes(round.zone)){state.completed.push(round.zone);state.stars+=earned;state.unlocked=Math.min(5,Math.max(state.unlocked,zoneIndex(round.zone)+1));saveState()}show('map')}
function advanceFoodRound(){if(!round.foodRevealed)return;if(round.index>=round.food.length-1){completeFoodAndReturnMap();return}round.index++;round.foodSelected=new Set();round.foodRevealed=false;round.foodPoints=0;round.busy=false;renderQuestion()}
function selectOption(kind,value,element){if(kind==='education')return selectEducationOption(value);if(kind==='food'||kind==='food-confirm')return selectFoodOption(kind,value,element);return selectOptionLegacy(kind,value,element)}
function confirmResetAll(){showModal('<h2>ล้างทุกด่าน?</h2><p>คะแนนรวม ดาว และสถานะด่านทั้งหมดจะถูกล้าง<br>เพื่อเริ่มเล่นกับเด็กคนใหม่</p><button class="mini-btn red" id="yesResetAll">ล้างทุกด่าน</button> <button class="mini-btn alt" id="noResetAll">ยกเลิก</button>');setTimeout(()=>{document.getElementById('yesResetAll').addEventListener('click',()=>{state={stars:0,completed:[],unlocked:1};saveState();stopAR();hideModal();show('map')});document.getElementById('noResetAll').addEventListener('click',hideModal)},0)}
document.getElementById('resetBtnPlay').addEventListener('click',confirmResetAll);
document.getElementById('startBtn').addEventListener('click',()=>show('map'));document.getElementById('helpBtn').addEventListener('click',help);document.querySelectorAll('#soundBtn,#soundBtn2,#soundBtn3').forEach(b=>b.addEventListener('click',toggleSound));document.getElementById('backMap').addEventListener('click',()=>show('map'));document.querySelectorAll('#arBtnMap,#arBtnPlay').forEach(b=>b.addEventListener('click',toggleAR));document.getElementById('resetBtn').addEventListener('click',()=>{showModal('<h2>เริ่มเกมใหม่?</h2><p>ดาวและด่านที่ปลดล็อกทั้งหมดจะถูกล้าง</p><button class="mini-btn red" id="yesReset">ล้างข้อมูล</button> <button class="mini-btn alt" id="noReset">ยกเลิก</button>');setTimeout(()=>{document.getElementById('yesReset').addEventListener('click',()=>{state={stars:0,completed:[],unlocked:1};saveState();hideModal();renderMap()});document.getElementById('noReset').addEventListener('click',hideModal)},0)});
renderMap();
})();
</script>
