<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการสมาชิก VIP | ครูกุ้งสอนไอที</title><link rel="stylesheet" href="css/membership.css?v=member-21-spark"><script src="js/firebase-sdk-loader.js?v=member-21-spark"></script><script src="js/membership-config.js?v=member-21-spark"></script><script src="js/vip-access.js?v=member-21-spark"></script><script type="module" src="js/membership-boot.mjs?v=member-21-spark"></script></head>
<body><main class="member-admin"><header><div><a href="index.html">← กลับเว็บไซต์</a><h1>จัดการสมาชิก VIP</h1><p>ตรวจชื่อ Facebook เทียบทะเบียนเดิมก่อนอนุมัติ หากไม่แน่ใจให้ขอหลักฐานเป็นรายบุคคล</p></div><button id="adminSignOut" type="button">ออกจากระบบ</button></header><p id="adminMemberStatus" role="status" aria-live="polite">กำลังตรวจสิทธิ์แอดมิน…</p>
<section id="memberPanel" hidden><div class="member-summary" id="memberSummary"></div><form id="memberFilters" class="member-filters"><label>สถานะ <select id="memberFilterStatus"><option value="">ทั้งหมด</option value="pending">รออนุมัติ</option><option value="approved">อนุมัติแล้ว</option><option value="rejected">ไม่อนุมัติ</option><option value="disabled">ระงับสิทธิ์</option></select></label><label>ค้นหาจาก <select id="memberSearchBy"><option value="facebookName">ชื่อ Facebook</option><option value="email">อีเมล</option></select></label><input id="memberSearch" aria-label="ค้นหาจากคำขึ้นต้นชื่อหรืออีเมล" maxlength="120" placeholder="ค้นหาจากคำขึ้นต้นชื่อหรืออีเมล"><button type="submit">ค้นหา / โหลดใหม่</button></form><div class="member-table-wrap"><table><thead><tr><th>ชื่อ Facebook</th><th>อีเมล</th><th>สมัครเมื่อ</th><th>สถานะ</th><th>ดำเนินการ</th></tr></thead><tbody id="membersBody"></tbody></table></div><button id="membersNext" type="button" hidden>หน้าถัดไป</button></section>
<dialog id="memberConfirm" aria-labelledby="memberConfirmTitle"><h2 id="memberConfirmTitle"></h2><p id="memberConfirmText"></p><div class="dialog-actions"><button id="memberCancel" type="button">ยกเลิก</button><button id="memberConfirmAction" type="button" class="danger">ยืนยัน</button></div></dialog>
</main><script type="module" src="js/membership-admin.mjs"></script></body></html>
